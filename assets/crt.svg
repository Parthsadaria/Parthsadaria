      <text x="34" y="58" fill="#9dffc0" clip-path="url(#c0)" textLength="72" lengthAdjust="spacing" xml:space="preserve">$ whoami</text><text x="34" y="80" fill="#33ff77" clip-path="url(#c1)" textLength="684" lengthAdjust="spacing" xml:space="preserve">parth — second-year AI/ML student. builds first, reads docs after it breaks.</text><text x="34" y="124" fill="#9dffc0" clip-path="url(#c3)" textLength="135" lengthAdjust="spacing" xml:space="preserve">$ cat focus.txt</text><text x="34" y="146" fill="#33ff77" clip-path="url(#c4)" textLength="333" lengthAdjust="spacing" xml:space="preserve">breaking things until they make sense</text><text x="34" y="168" fill="#33ff77" clip-path="url(#c5)" textLength="360" lengthAdjust="spacing" xml:space="preserve">adversarial ML + AI security (long game)</text><text x="34" y="190" fill="#33ff77" clip-path="url(#c6)" textLength="324" lengthAdjust="spacing" xml:space="preserve">GPU-heavy web stuff nobody asked for</text><text x="34" y="234" fill="#9dffc0" clip-path="url(#c8)" textLength="72" lengthAdjust="spacing" xml:space="preserve">$ status</text><text x="34" y="256" fill="#33ff77" clip-path="url(#c9)" textLength="342" lengthAdjust="spacing" xml:space="preserve">FantomTV rework .......... in progress</text><text x="34" y="278" fill="#33ff77" clip-path="url(#c10)" textLength="306" lengthAdjust="spacing" xml:space="preserve">Zolt ..................... shipped</text><text x="34" y="300" fill="#33ff77" clip-path="url(#c11)" textLength="333" lengthAdjust="spacing" xml:space="preserve">next ..................... classified</text><text x="34" y="322" fill="#9dffc0" clip-path="url(#c12)" textLength="18" lengthAdjust="spacing" xml:space="preserve">$ </text>
